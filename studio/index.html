<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nacre</title>
<style>
  *, *::before, *::after { box-sizing: border-box; text-transform: lowercase !important; }
  :root {
    --bg: #0a0a0a; --surface: #111111; --surface-2: #161616; --inset: #0d0d0d;
    --line: #212121; --line-strong: #3a3a3a;
    --ink: #ecece6; --ink-2: #9b9b93; --ink-3: #66665f;
    --ok: #3fb97a; --err: #e5484d; --warn: #d4a72c;
    --sans: "inter", -apple-system, blinkmacsystemfont, "segoe ui", system-ui, sans-serif;
    --mono: "jetbrains mono", "ibm plex mono", "cascadia code", ui-monospace, consolas, monospace;
  }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14.5px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  a { color: var(--ink-2); text-decoration: none; }
  a:hover { color: var(--ink); }
  code { font-family: var(--mono); font-size: 0.9em; color: var(--ink); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .num { text-align: right; white-space: nowrap; }
  .dim { color: var(--ink-3); }
  .ok { color: var(--ok); }
  .err { color: var(--err); }
  .warn { color: var(--warn); }
  .mt { margin-top: 16px; }

  /* quiet sticky top nav */
  .topbar { border-bottom: 1px solid var(--line); background: rgba(10,10,10,0.92); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; }
  .topbar-inner {
    max-width: 1120px; margin: 0 auto; padding: 0 24px; height: 52px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .wordmark {
    border: none; background: transparent; padding: 0; cursor: pointer;
    font-family: var(--mono); font-size: 15px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink);
  }
  .nav { display: flex; align-items: stretch; height: 100%; gap: 4px; }
  .nav-btn {
    border: none; border-bottom: 2px solid transparent; background: transparent;
    color: var(--ink-3); font-family: var(--mono); font-size: 12px;
    padding: 0 14px; cursor: pointer; transition: color 120ms, border-color 120ms;
  }
  .nav-btn:hover { color: var(--ink); }
  .nav-btn.active { color: var(--ink); border-bottom-color: var(--ink); }
  .ext-links { font-family: var(--mono); font-size: 12px; }

  /* calm editorial homepage flow (one beat at a time) */
  .story { max-width: 820px; margin: 0 auto; padding: 72px 24px 96px; }
  .hero-beat { padding-bottom: 72px; }
  .hero-title {
    margin: 0 0 18px; font-size: 35px; font-weight: 500;
    letter-spacing: -0.028em; line-height: 1.14; color: var(--ink); max-width: 760px;
  }
  .hero-copy {
    margin: 0 0 38px; font-size: 15.5px; line-height: 1.65;
    color: var(--ink-2); max-width: 610px;
  }
  .diagram-box {
    border: 1px solid var(--line); background: var(--inset);
    padding: 22px 20px 16px; margin-bottom: 28px;
  }
  .cmd-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1px solid var(--line-strong); background: var(--surface); padding: 11px 14px;
  }
  .cmd-bar code { font-size: 13px; color: var(--ink); overflow-x: auto; white-space: nowrap; }
  .copy-btn {
    border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink-2);
    font-family: var(--mono); font-size: 11px; padding: 5px 11px; cursor: pointer; flex: 0 0 auto;
  }
  .copy-btn:hover { border-color: var(--ink); color: var(--ink); }
  .inline-copy { margin: 6px 10px; }
  .quiet-links {
    margin-top: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 12px; color: var(--ink-3);
  }
  .link-btn {
    border: none; background: transparent; padding: 0; color: var(--ink-2);
    font-family: inherit; font-size: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 4px;
  }
  .link-btn:hover { color: var(--ink); }

  /* story beats with generous breathing room */
  .beat { padding: 76px 0 0; border-top: 1px solid var(--line); margin-top: 16px; }
  .beat-k { font-size: 11.5px; color: var(--ink-3); margin-bottom: 12px; letter-spacing: 0.04em; }
  .beat-title {
    margin: 0 0 12px; font-size: 25px; font-weight: 500;
    letter-spacing: -0.02em; line-height: 1.25; color: var(--ink);
  }
  .beat-copy { margin: 0 0 28px; font-size: 14.5px; color: var(--ink-2); max-width: 660px; }

  /* single focused interactive widget */
  .widget { border: 1px solid var(--line); background: var(--surface); }
  .tab-strip {
    display: flex; align-items: center; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); background: var(--inset);
  }
  .tab-label { padding: 11px 15px; border-right: 1px solid var(--line); font-size: 11px; color: var(--ink-3); }
  .tab-item {
    border: none; border-right: 1px solid var(--line); background: transparent;
    color: var(--ink-3); font-family: var(--mono); font-size: 11.5px;
    padding: 11px 15px; cursor: pointer;
  }
  .tab-item:hover { color: var(--ink); }
  .tab-item.active { background: var(--surface); color: var(--ink); font-weight: 600; }
  .widget-body { padding: 20px; }
  .tool-pill {
    padding: 8px 11px; border: 1px solid var(--line); background: var(--inset);
    font-size: 12px; color: var(--ink-2); flex: 0 0 auto;
  }
  .caption { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-3); }

  .verdict-strip {
    margin-top: 16px; padding: 14px 16px; border: 1px solid var(--line); background: var(--inset);
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }
  .verdict-pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border: 1px solid currentColor; }
  .verdict-expr { font-size: 12.5px; color: var(--ink); word-break: break-all; flex: 1; }
  .verdict-meta { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

  /* chapter 2 calm two-up cards */
  .two-up { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .story-card { border: 1px solid var(--line); background: var(--surface); padding: 24px; display: flex; flex-direction: column; }
  .card-k { font-size: 11.5px; color: var(--ink-3); margin-bottom: 10px; }
  .big-stat { font-size: 38px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 10px; }
  .big-sub { font-size: 15px; font-weight: 400; color: var(--ink-2); }
  .card-p { margin: 0 0 20px; font-size: 13px; color: var(--ink-2); line-height: 1.55; }
  .mini-bars { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; margin-top: auto; }
  .mbar-row { display: flex; justify-content: space-between; color: var(--ink-2); margin-top: 4px; }
  .mbar-track { height: 7px; background: var(--inset); border: 1px solid var(--line); }
  .mbar-fill { height: 100%; }
  .mbar-fill.ok { background: var(--ok); }
  .mbar-fill.warn { background: var(--warn); }
  .ladder { display: flex; flex-direction: column; border-top: 1px solid var(--line); margin-top: auto; }
  .lad-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }

  /* chapter 3 seal strip */
  .seal-strip {
    border: 1px solid var(--line); background: var(--surface); padding: 18px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .seal-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12.5px; }
  .end-nav { margin-top: 32px; display: flex; gap: 10px; flex-wrap: wrap; }

  /* deeper workbench pages (compiler / benchmarks / repl) */
  .shell { max-width: 1120px; margin: 0 auto; padding: 32px 24px 64px; }
  .masthead { margin-bottom: 24px; }
  .masthead h1 { margin: 0 0 8px; font-size: 24px; font-weight: 500; letter-spacing: -0.02em; }
  .lead { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 720px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .grid-comp { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) {
    .hero-title { font-size: 28px; }
    .two-up, .grid-2, .grid-comp { grid-template-columns: 1fr; }
    .ext-links { display: none; }
  }
  .pane { border: 1px solid var(--line); background: var(--surface); }
  .pane-head {
    padding: 11px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); background: var(--inset);
  }
  .pane-head.compact { padding: 8px 0 10px; border-bottom: 1px solid var(--line); background: transparent; margin-bottom: 12px; }
  .kpi-strip { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); background: var(--line); gap: 1px; }
  .kpi { background: var(--surface); padding: 14px 16px; }
  .kpi-k { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-bottom: 4px; }
  .kpi-v { font-family: var(--mono); font-size: 17px; font-weight: 600; }

  .preset-list { display: flex; flex-direction: column; }
  .preset-row {
    width: 100%; text-align: left; border: none; border-bottom: 1px solid var(--line);
    background: transparent; color: var(--ink); padding: 11px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer;
  }
  .preset-row:hover { background: var(--surface-2); }
  .preset-row.active { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--ink); }
  .preset-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .preset-title { font-size: 13px; font-weight: 500; }
  .preset-sub { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .badge { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; }
  .badge.ok { border-color: rgba(63,185,122,0.45); color: var(--ok); }
  .badge.err { border-color: rgba(229,72,77,0.5); color: var(--err); }
  .badge.warn { border-color: rgba(212,167,44,0.45); color: var(--warn); }

  .sub-block { padding: 16px; border-top: 1px solid var(--line); }
  .field-label { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-bottom: 8px; }
  .seg-row { display: flex; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .seg { border: none; background: var(--inset); color: var(--ink-2); font-family: var(--mono); font-size: 11px; padding: 5px 10px; cursor: pointer; }
  .seg.active { background: var(--surface-2); color: var(--ink); font-weight: 600; }

  .input-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .inp {
    flex: 1; min-width: 140px; width: 100%; background: var(--inset); color: var(--ink);
    border: 1px solid var(--line-strong); padding: 8px 11px; font-size: 12.5px; outline: none; border-radius: 0;
  }
  .inp:focus { border-color: var(--ink); }
  textarea.inp { display: block; width: 100%; border: none; border-bottom: 1px solid var(--line); padding: 12px 16px; resize: vertical; }

  .act-btn {
    border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink);
    font-family: var(--mono); font-size: 11.5px; padding: 8px 14px; cursor: pointer; white-space: nowrap;
  }
  .act-btn:hover { border-color: var(--ink); }
  .act-btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
  .act-btn.danger { border-color: rgba(229,72,77,0.6); color: var(--err); background: transparent; }
  .act-btn.danger:hover { background: rgba(229,72,77,0.1); }

  .kv-row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .kv-row.compact { margin-top: 10px; border-top: 1px solid var(--line); }
  .kv-k { font-family: var(--mono); color: var(--ink-3); }

  .drawer { padding: 11px 20px; border-top: 1px solid var(--line); background: var(--inset); }
  .drawer summary { cursor: pointer; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .drawer summary:hover { color: var(--ink-2); }
  pre.code {
    margin: 10px 0 0; padding: 13px 15px; background: var(--bg); border: 1px solid var(--line);
    font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--ink);
    white-space: pre-wrap; word-break: break-word; overflow-x: auto;
  }
  pre.code.clean { margin-top: 0; background: var(--inset); }
  pre.code.hex { font-size: 11px; color: var(--ink-2); letter-spacing: 0.03em; }

  .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  .tbl th, .tbl td { padding: 9px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .tbl th { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--ink-3); background: var(--inset); }
  .tbl tr.total-row td { background: var(--surface-2); font-weight: 600; }
  .rule-cell { max-width: 340px; word-break: break-word; font-size: 11px; color: var(--ink-2); }
  .bar { display: inline-block; width: 60px; height: 6px; background: var(--line); vertical-align: middle; margin-left: 8px; }
  .fill { display: block; height: 100%; background: var(--ink-2); }
  .fill.ok { background: var(--ok); }
  .fill.err { background: var(--err); }
  .fill.warn { background: var(--warn); }

  .foot { border-top: 1px solid var(--line); }
  .foot-inner {
    max-width: 1120px; margin: 0 auto; padding: 18px 24px 40px;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  }
</style>
</head>

  const bin = atob(WASM_B64), bytes = new Uint8Array(bin.length);

  const k = instance.exports, enc = new TextEncoder(), dec = new TextDecoder(), app = document.getElementById("app");
  const call = (fn, s) => {

    window.scrollTo(0, y);
  };
  const runNativeWasm = async (lex, head, argStr, outEl) => {
    const arg = BigInt(argStr || "12");
    const r = call("nacre_compile_wasm_reflex", lex + "\n---\n" + head);
    if (r.st !== 0) { outEl.textContent = dec.decode(r.buf).toLowerCase(); return; }
    const { instance: rf } = await WebAssembly.instantiate(r.buf);
    const val = rf.exports.run(arg, 50000n), status = rf.exports.get_status(), calls = 50000n - rf.exports.get_fuel_rem();

  };

      return runNativeWasm(document.getElementById("repl-lex").value, document.getElementById("wasm-head").value.trim(), document.getElementById("wasm-arg").value, document.getElementById("wasm-native-out"));

    if (el.dataset.enter === "repl_run") { e.preventDefault(); render("repl_run", document.getElementById("repl-lex").value + "\n---\n" + el.value); }
  });
